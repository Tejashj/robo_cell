name: robo_cell
description: ROBO CELL APPLICATION
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # SUPABASE
  supabase_flutter: ^2.5.6

  # ENV
  flutter_dotenv: ^5.1.0

  # GOOGLE FONTS
  google_fonts: ^6.2.1

  # URL LAUNCHER
  url_launcher: ^6.2.6

  # IMAGE PICKER
  image_picker: ^1.1.2

  # EXCEL EXPORT
  excel: ^4.0.3

  # STORAGE
  path_provider: ^2.1.3

  # SHARE FILES
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # APP ICON GENERATOR
  flutter_launcher_icons: ^0.13.1

flutter:

  uses-material-design: true

  assets:
    - assets/
    - .env

# =========================================================
# APP ICON CONFIGURATION
# =========================================================

flutter_launcher_icons:

  # GENERATE FOR BOTH
  android: true
  ios: true

  # MAIN ICON IMAGE
  image_path: "assets/appicon1.jpg"

  # ANDROID ADAPTIVE ICONS
  adaptive_icon_background: "#000000"

  # USE SAME PRE-STYLED IMAGE
  adaptive_icon_foreground: "assets/appicon1.jpg"

  # SLIGHT PADDING
  adaptive_icon_foreground_inset: 80

  # OPTIONAL
  remove_alpha_ios: true
