name: robo_cell
description: ROBO CELL APPLICATION
publish_to: 'none'

version: 1.0.1+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # SUPABASE
  supabase_flutter: ^2.5.6

  # ENV
  flutter_dotenv: ^5.1.0

  # GOOGLE FONTS
  google_fonts: ^6.2.1

  # URL LAUNCHER
  url_launcher: ^6.2.6

  # IMAGE PICKER
  image_picker: ^1.1.2

  # EXCEL EXPORT
  excel: ^4.0.3

  # STORAGE
  path_provider: ^2.1.3

  # SHARE FILES
  share_plus: ^9.0.0
  font_awesome_flutter: ^11.0.0
  
  # STATE MANAGEMENT
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  flutter_svg: ^2.0.10
  flutter_staggered_grid_view: ^0.7.0
  smooth_page_indicator: ^2.0.1
  carousel_slider: ^5.1.2

  # BIOMETRICS & SECURITY
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  screen_protector: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # APP ICON GENERATOR
  flutter_launcher_icons: ^0.13.1

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - .env

# =========================================================
# APP ICON CONFIGURATION
# =========================================================

flutter_launcher_icons:

  # GENERATE FOR BOTH
  android: true
  ios: true

  # MAIN ICON IMAGE
  image_path: "assets/appicon1.jpg"

  # ANDROID ADAPTIVE ICONS
  adaptive_icon_background: "#000000"

  # USE SAME PRE-STYLED IMAGE
  adaptive_icon_foreground: "assets/appicon1.jpg"

  # SLIGHT PADDING
  adaptive_icon_foreground_inset: 80

  # OPTIONAL
  remove_alpha_ios: true
