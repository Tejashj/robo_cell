name: robo_cell

description: ROBO CELL APPLICATION

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:

  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # SUPABASE
  supabase_flutter: ^2.5.6

  # ENV
  flutter_dotenv: ^5.1.0

  # GOOGLE FONTS
  google_fonts: ^6.2.1

  # URL LAUNCHER
  url_launcher: ^6.2.6

  # QR GENERATOR
  qr_flutter: ^4.1.0

  # QR SCANNER
  mobile_scanner: ^5.1.1

  # IMAGE PICKER
  image_picker: ^1.1.2

  # EXCEL EXPORT
  excel: ^4.0.3

  # STORAGE
  path_provider: ^2.1.3

  # SHARE FILES
  share_plus: ^9.0.0

dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:

  uses-material-design: true

  assets:

    - assets/
    - .env



# This should be at the root level, not indented under 'flutter'
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/rcell.jpg" # Ensure this path matches your assets folder
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/rcell.jpg"