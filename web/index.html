<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Robo Cell – BIT Robotics & AI Club">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Robo Cell">

  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">

  <title>Robo Cell</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #030303;
      color: #16A085;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div id="loading">Loading Robo Cell...</div>

  <script>
    // Clear old service workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (let reg of regs) reg.unregister();
      });
    }

    // Load Flutter with CanvasKit renderer
    window.addEventListener('load', function() {
      _flutter.loader.load({
        config: {
          renderer: 'canvaskit',
        },
        onEntrypointLoaded: async function(engineInitializer) {
          const appRunner = await engineInitializer.initializeEngine();
          document.getElementById('loading').style.display = 'none';
          appRunner.runApp();
        },
      });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
